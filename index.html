<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
</head>
<body>

    <div class="d1">

        <h1>Button Maker</h1>

        <div class="box">
             <label>BACKGROUND COLOR</label>
             <input type="text" id="bgColor">

             <label>FONT COLOR </label>
             <input type="text" id="fontColor">
             
             <label>FONT SIZE (in px) </label>
             <input type="text" id="fontSize">
             
             <label>FONT WEIGHT</label>
             <input type="text" id="fontWeight">

             <label>PADDING (in px)</label>
             <input type="text" id="padding">

             <label>BORDER RADIUS (in px)</label>
             <input type="text" id="borderRadius">

             <br>

             <div class="Addbtn">
                <button onclick="onApplybtn()" class="btn btn-primary ">Apply </button>
             </div>
             <br>

             <button id="onCustomBtn" class="w-50 ">Custom Button</button>

        </div>


    </div>

    <script src="index.js"></script>
</body>
</html>
